<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Romina Bruera - Servicios de Maquillaje Profesional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zzvcqytfzrgptlqjmmxv.supabase.co">
    <link rel="dns-prefetch" href="https://zzvcqytfzrgptlqjmmxv.supabase.co">
    <script>
      // Fire the data request immediately, in parallel with the React bundle downloading/
      // parsing, instead of waiting for React to mount before asking Supabase for anything.
      // Hero/logo/everything else only render once this resolves, so this is the single
      // biggest lever for getting them on screen sooner.
      window.__pageDataPromise = fetch(
        '%VITE_SUPABASE_URL%/rest/v1/page_config?id=eq.main&select=data',
        { headers: { apikey: '%VITE_SUPABASE_ANON_KEY%' } }
      ).then(function (r) { return r.ok ? r.json() : null }).catch(function () { return null })
    </script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <style>
      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FAFAF7;
        transition: opacity 0.3s ease;
      }
      #page-loader img {
        width: 96px;
        height: 96px;
        animation: page-loader-pulse 1.1s ease-in-out infinite;
      }
      #page-loader.page-loader-hidden {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes page-loader-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.9); opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="page-loader"><img src="/logo-loading.png" alt="Cargando" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide the loader as soon as the prefetched page data resolves, but never
      // let it stay on screen longer than 3s even if the request stalls.
      var __pageLoaderHidden = false
      function __hidePageLoader() {
        if (__pageLoaderHidden) return
        __pageLoaderHidden = true
        var el = document.getElementById('page-loader')
        if (!el) return
        el.classList.add('page-loader-hidden')
        setTimeout(function () { el.remove() }, 300)
      }
      window.__pageDataPromise.then(__hidePageLoader).catch(__hidePageLoader)
      setTimeout(__hidePageLoader, 3000)
    </script>
  </body>
</html>
